<meta charset="utf-8">
<title>ShelterLink</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
  header{background:#0f766e;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .logo{font-weight:800;font-size:20px;letter-spacing:.3px}
  header .spacer{flex:1}
  header select{padding:6px 8px;border-radius:6px;border:0;font-size:13px}
  header .badge{background:#134e4a;padding:4px 10px;border-radius:999px;font-size:12px}
  .wrap{display:flex;min-height:calc(100vh - 52px)}
  nav{width:210px;background:#fff;border-right:1px solid #e2e8f0;padding:12px 8px}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:14px;color:#334155;cursor:pointer}
  nav button:hover{background:#f1f5f9}
  nav button.active{background:#e6fffb;color:#0f766e;font-weight:700}
  main{flex:1;padding:22px 26px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#64748b;font-size:13px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .tile{cursor:pointer;text-align:center;padding:26px 16px}
  .tile:hover{border-color:#0f766e}
  .tile .ico{font-size:26px}
  .tile .t{font-weight:700;margin-top:8px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;margin:2px 2px 0 0}
  .st-Current{background:#dcfce7;color:#166534}.st-Adopted{background:#e0e7ff;color:#3730a3}
  .st-Pre-Listing{background:#fef9c3;color:#854d0e}.st-Not-Fit{background:#fee2e2;color:#991b1b}.st-Removed{background:#f1f5f9;color:#475569}
  .tp{background:#f1f5f9;color:#475569}
  .sectionTitle{font-weight:700;margin:22px 0 8px;font-size:15px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #eef2f7;font-size:13px}
  th{background:#f8fafc;color:#475569;font-weight:600}
  input,select.f,textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;margin-top:4px}
  input[type=checkbox]{width:auto;margin:0;padding:0;flex:none;transform:scale(1.15)}
  #toasts{position:fixed;top:64px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{min-width:230px;max-width:380px;background:#0f766e;color:#fff;padding:11px 14px;border-radius:9px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13.5px;line-height:1.45;animation:tin .22s ease-out;display:flex;gap:9px;align-items:flex-start}
  .toast.err{background:#b4442b} .toast.warn{background:#9a6700}
  .toast .tk{font-size:15px;line-height:1.2}
  .toast.out{animation:tout .3s ease-in forwards}
  @keyframes tin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateX(26px)}}
  label.chk{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer}
  table input[type=date],table select.f{margin-top:0;padding:5px;font-size:12px}
  label{font-size:12px;color:#475569;font-weight:600;display:block;margin-top:10px}
  .btn{background:#0f766e;color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  .btn.sec{background:#e2e8f0;color:#0f172a}
  .btn.warn{background:#b45309}
  .muted{color:#94a3b8;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters select{width:auto}
  .back{cursor:pointer;color:#0f766e;font-size:13px;font-weight:600;margin-bottom:10px;display:inline-block}
  .photo{height:120px;border-radius:10px;background:linear-gradient(135deg,#99f6e4,#a5b4fc);margin-bottom:10px}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:10px}
</style>

function toast(msg,type){
  let box=document.getElementById('toasts');

  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=`<span class="tk">${type==='err'?'⚠️':type==='warn'?'⚠️':'✅'}</span><span>${msg}</span>`;
  box.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},3200);
}

function nav(){
  const items=[['home','🏠 Home'],['listing','🐾 Adoption Listing']];
  if(can('apply'))items.push(['apply','📝 Adoption Request']);
  if(can('myprofile'))items.push(['myprofile','🙍 My Adopter Profile']);
  if(can('intake'))items.push(['intake','📥 Animal Intake']);
  if(can('profile'))items.push(['profile','📋 Animal Profiles']);
  if(can('applications'))items.push(['applications','✅ Adoption Applications']);
  if(can('users'))items.push(['users','👤 User Administration']);
  if(can('system'))items.push(['system','⚙️ System Administration']);
  return `<nav>${items.map(([v,l])=>`<button class="${S.view===v?'active':''}" onclick="go('${v}')">${l}</button>`).join('')}</nav>`;
}

function home(){
  const groups=[
   ['User Functions',[['listing','🐾','Adoption Listing',true],['apply','📝','Adoption Request',can('apply')],['myprofile','🙍','My Adopter Profile',can('myprofile')]]],
   ['Animal Management',[['profile','📋','Animal Profiles',can('profile')],['intake','📥','Animal Intake',can('intake')],['applications','✅','Adoption Applications',can('applications')]]],
   ['Administration',[['users','👤','User Administration',can('users')],['system','⚙️','System Administration',can('system')]]]
  ];
  let h=`<h1>Welcome, ${me().name}</h1><div class="sub">You are signed in as <b>${role()}</b>. You only see the functions your role allows.</div>`;
  groups.forEach(([g,tiles])=>{
    const vis=tiles.filter(t=>t[3]);
    if(!vis.length)return;
    h+=`<div class="sectionTitle">${g}</div><div class="grid">`+
      vis.map(([v,ic,t])=>`<div class="card tile" onclick="go('${v}')"><div class="ico">${ic}</div><div class="t">${t}</div></div>`).join('')+`</div>`;
  });
  return h;
}

      <div style="margin-top:10px"><button class="btn" onclick="addMedical(${x.id})">Save medical record</button></div></div>`;
  }
  // Behaviour — hidden from vet
  if(!isVet){
    h+=`<div class="sectionTitle">🧠 Behaviour history</div><table><tr><th>Date</th><th>By</th><th>Detail</th><th>Recommendation</th><th>Follow-up</th><th>Reassess on</th></tr>
      ${S.behaviour.filter(b=>b.animal===x.id).map(b=>`<tr><td>${b.date}</td><td>${uName(b.by)}</td><td>${b.desc}</td><td>${b.rec}</td><td>${b.followUp?'✔️ needed':'—'}</td><td>${b.reassess||'—'}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">None recorded.</td></tr>'}</table>`;
    if(isStaff){
      h+=`<div class="card" style="margin-top:10px"><b>Add behaviour assessment (Staff)</b>

  // Edit animal details — Staff/Admin set the listing information
  if(isStaff){
    h+=`<div class="sectionTitle">✏️ Edit animal details (Staff)</div>

     <div class="muted" style="margin-top:6px">Saving stamps the Last modified date automatically.</div></div>`;
  }
  // Status controls
  h+=`<div class="sectionTitle">Status</div><div class="card"><div class="row">`;
  if(isVet||r==='Administrator')h+=`<button class="btn sec" onclick="setStatus(${x.id},'Pre-Listing')">Vet: mark Pre-Listing</button>`;
  if(isStaff)h+=`<button class="btn" onclick="setStatus(${x.id},'Current')">Staff: publish (Current)</button>
     <button class="btn sec" onclick="setStatus(${x.id},'Adopted')">Mark Adopted</button>
     <button class="btn warn" onclick="setStatus(${x.id},'Removed')">Remove</button>`;
  h+=`</div><div class="muted" style="margin-top:6px">Lifecycle: Not Fit → Pre-Listing (vet) → Current (staff) → Adopted.</div></div>`;
  return h;
}

function addUser(){
  const name=$('nu_name').value.trim(), email=$('nu_email').value.trim().toLowerCase();
  if(!name||!email){toast('Enter a name and email.','err');return}
  if(S.users.some(u=>u.email.toLowerCase()===email)){toast('A user with that email already exists.','err');return}
  let r=$('nu_role').value;
  if(r==='Administrator'&&S.users.some(u=>u.role==='Administrator')){toast('Only one Administrator allowed at a time. Change the current Administrator first.','err');return}
  const id=Math.max(0,...S.users.map(u=>u.id))+1;
  S.users.push({id,name,title:$('nu_title').value,email,role:r,status:$('nu_status').value});
  toast('User created: '+name+' ('+r+'). They can log in with password BISM7255.');render();
}

function addPhoto(id){const f=$('pfile').files[0];

  r.onload=e=>{S.photos.push({id:nextPhoto++,animal:id,img:e.target.result,date:dt,by:S.currentUserId,useOnListing:use});touch(id);
    toast('Photo uploaded'+(use?' and set as the adoption listing photo.':'.'));render()};
  r.readAsDataURL(f);}

      <td><input type="date" value="${a.followUpDate||''}" onchange="setCheck(${a.id},'followUpDate',this.value)"></td>
      <td>${a.status}</td>
      <td>${a.status==='Approved'?'<span class="muted">✔ finalised</span>':a.status==='Rejected'?'<span class="muted">rejected</span>':`<button class="btn" onclick="approveApp(${a.id})">Approve &amp; adopt</button> <button class="btn warn" onclick="rejectApp(${a.id})">Reject</button>`}</td></tr>`;
   }).join('')||'<tr><td colspan=12 class="muted">No applications yet.</td></tr>'}</table>`;
}
function setCheck(id,k,v){S.applications.find(a=>a.id===id)[k]=v;
  const L={reference:'Reference check',home:'Home suitability',pet:'Pet compatibility',meet:'Meet-and-greet date',agreement:'Adoption agreement',payment:'Payment status',followUpDate:'Follow-up visit'};
  toast(L[k]+' updated'+(typeof v==='string'&&v?' to '+v:v===true?' — signed':v===false?' — not signed':'')+'.');render()}
function approveApp(id){const a=S.applications.find(x=>x.id===id);
  if([a.reference,a.home,a.pet].some(c=>c!=='Pass')){if(!confirm('Not all suitability checks are marked Pass. Approve anyway?'))return}
  a.status='Approved';const an=S.animals.find(x=>x.id===a.animal);if(an){an.status='Adopted';an.adoptedBy=a.adopter}
  toast('Approved. Ownership of '+(an?an.name:'the animal')+' passed to '+uName(a.adopter)+'. It is now Adopted and removed from the listing.');render()}
function rejectApp(id){const a=S.applications.find(x=>x.id===id);a.status='Rejected';toast('Application from '+uName(a.adopter)+' rejected.','warn');render()}
function chRole(id,r){const u=S.users.find(x=>x.id===id);
  if(r==='Administrator'){ if(u.status!=='Active'){toast('The new Administrator must have an Active status first.','err');return render()}
    const cur=S.users.find(x=>x.role==='Administrator');
    if(cur&&cur.id!==id){ if(!confirm('Only one Administrator allowed. Transfer the Administrator role from '+cur.name+'? They will become Staff.')){return render()}
      cur.role='Staff';cur.roleBy=S.currentUserId;cur.roleAt=now(); } }
  u.role=r;u.roleBy=S.currentUserId;u.roleAt=now();toast(u.name+' is now '+r+'. The change has been recorded against your name.');render()}
function chStatus(id,s){const u=S.users.find(x=>x.id===id);
  if(u.role==='Administrator'&&s==='Inactive'){toast('The Administrator cannot be set to Inactive.','err');return render()}
  u.status=s;u.statusBy=S.currentUserId;u.statusAt=now();toast(u.name+' set to '+s+'. The change has been recorded against your name.',s==='Inactive'?'warn':'');render()}
function toggleMed(id){const m=S.medications.find(x=>x.id===id);m.active=!m.active;
  toast(m.active?(m.name+' reactivated and available again.'):(m.name+' retired — removed from new records, but kept on the animals already treated with it.'),m.active?'':'warn');render()}
function addMed(){const n=$('newmed').value.trim();if(!n){toast('Enter a medication name first.','err');return}S.medications.push({id:nextMed++,name:n,desc:'Added by admin',active:true});$('newmed').value='';toast('Medication "'+n+'" added and available in new records.');render()}

// ---- Excel database (SheetJS) ----
let fileHandle=null, saveT=null;
function buildWB(){
  const wb=XLSX.utils.book_new();
  const add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),n);
  add('Users',S.users);
  add('Animals',S.animals.map(a=>({...a,temperaments:(a.temperaments||[]).join('; ')})));
  add('Medical',S.medical); add('Behaviour',S.behaviour);
  add('Applications',S.applications); add('Medications',S.medications);
  // Photos: metadata only — the image itself stays in the app, not the workbook
  add('Photos',S.photos.map(p=>({id:p.id,animal:p.animal,animalName:(S.animals.find(a=>a.id===p.animal)||{}).name||'',date:p.date,takenBy:uName(p.by),useOnListing:p.useOnListing?'Yes':'No'})));
  add('Breeds',Object.entries(S.breeds).flatMap(([sp,bs])=>bs.map(b=>({species:sp,breed:b,description:S.breedDesc[b]||''}))));
  return wb;
}
function loadWB(wb){
  const g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]):null;
  const u=g('Users'); if(u)S.users=u;
  const a=g('Animals'); if(a)S.animals=a.map(x=>({...x,temperaments:String(x.temperaments||'').split(';').map(s=>s.trim()).filter(Boolean)}));
  const m=g('Medical'); if(m)S.medical=m; const b=g('Behaviour'); if(b)S.behaviour=b;
  const ap=g('Applications'); if(ap)S.applications=ap; const md=g('Medications'); if(md)S.medications=md;
  const br=g('Breeds'); if(br)br.forEach(r=>{if(r.breed)S.breedDesc[r.breed]=r.description||''});
  S.animals.forEach(a=>{a.dod=a.dod||'';a.created=a.created||now();a.modified=a.modified||a.created;a.temperaments=a.temperaments||[]});
  S.behaviour.forEach(b=>{b.followUp=b.followUp===true||b.followUp==='TRUE'||b.followUp==='Yes';b.reassess=b.reassess||''});
  S.applications.forEach(p=>{p.meet=p.meet||'';p.payment=p.payment||'Unpaid';p.followUpDate=p.followUpDate||''});
}
function exportExcel(){ if(!window.XLSX){toast('Open this file in Chrome or Edge to use the Excel features.');return} XLSX.writeFile(buildWB(),'ShelterLink_Data.xlsx'); }
function importExcelFile(file){ if(!window.XLSX){toast('Open in Chrome/Edge.');return} if(!file)return;
  const r=new FileReader(); r.onload=e=>{ try{loadWB(XLSX.read(e.target.result,{type:'array'})); toast('Data loaded from Excel.'); render();}catch(err){toast('Could not read that file.')} }; r.readAsArrayBuffer(file); }
async function syncFile(){ if(!window.XLSX){toast('Open in Chrome/Edge.');return}
  if(!window.showSaveFilePicker){toast('Live sync needs Chrome or Edge. Use Export / Import instead.');return}
  try{ fileHandle=await window.showSaveFilePicker({suggestedName:'ShelterLink_Data.xlsx',types:[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});
    await saveToFile(); S.synced=true; render(); toast('Connected. Your edits now auto-save to that Excel file.'); }catch(e){} }
async function saveToFile(){ if(!fileHandle||!window.XLSX)return;
  try{ const data=XLSX.write(buildWB(),{type:'array',bookType:'xlsx'}); const w=await fileHandle.createWritable(); await w.write(new Blob([data])); await w.close(); }catch(e){} }
function autosave(){ if(fileHandle){clearTimeout(saveT); saveT=setTimeout(saveToFile,700);} }
function doLogin(){
  const em=$('lemail').value.trim().toLowerCase(), pw=$('lpass').value;
  const u=S.users.find(x=>x.email.toLowerCase()===em);
  if(!u){S.loginErr='No account with that email.';return render()}
  if(u.status==='Inactive'){S.loginErr='This account is Inactive — contact an administrator.';return render()}
  if(pw!==PASSWORD){S.loginErr='Incorrect password.';return render()}
  u.lastLogin=now();
  S.currentUserId=u.id;S.authed=true;S.view='home';S.loginErr='';render();
}
function doSignup(){
  const name=$('su_name').value.trim(), email=$('su_email').value.trim().toLowerCase();
  if(!name||!email){S.loginErr='Enter a name and email to sign up.';return render()}
  if(S.users.some(u=>u.email.toLowerCase()===email)){S.loginErr='That email is already registered.';return render()}
  const id=Math.max(0,...S.users.map(u=>u.id))+1;
  S.users.push({id,name,title:'Mr',email,role:'Adopter',status:'Active',signup:now(),lastLogin:now(),roleBy:null,roleAt:'',statusBy:null,statusAt:'',household:'',housing:'',refs:''});
  S.currentUserId=id;S.authed=true;S.view='home';S.loginErr='';S.signup=false;render();
}
function toggleSignup(){S.signup=!S.signup;S.loginErr='';render()}
function quickFill(em){$('lemail').value=em;$('lpass').value=PASSWORD}
function logout(){S.authed=false;S.loginErr='';render()}
function loginView(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e,#134e4a)">
   <div style="background:#fff;border-radius:16px;padding:30px 32px;width:380px;box-shadow:0 12px 40px rgba(0,0,0,.25)">
     <div style="font-size:26px;font-weight:800;color:#0f766e;text-align:center">🐾 ShelterLink</div>
     <div class="muted" style="text-align:center;margin-bottom:16px">Animal Shelter &amp; Adoption Management</div>
     ${S.signup?`
       <div class="muted" style="margin-bottom:6px">Create an account — you'll join as an <b>Adopter</b> (Active).</div>
       <label>Full name</label><input id="su_name" placeholder="Your name">
       <label>Email</label><input id="su_email" placeholder="you@email.com">
       ${S.loginErr?`<div style="color:#b91c1c;font-size:12px;margin-top:8px">${S.loginErr}</div>`:''}
       <div style="margin-top:14px"><button class="btn" style="width:100%" onclick="doSignup()">Sign up</button></div>
       <div style="text-align:center;margin-top:12px"><span style="cursor:pointer;color:#0f766e;font-size:13px" onclick="toggleSignup()">← Back to log in</span></div>
     `:`
       <label>Email</label><input id="lemail" placeholder="you@shelterlink.org" onkeydown="if(event.key==='Enter')doLogin()">
       <label>Password</label><input id="lpass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
       ${S.loginErr?`<div style="color:#b91c1c;font-size:12px;margin-top:8px">${S.loginErr}</div>`:''}
       <div style="margin-top:14px"><button class="btn" style="width:100%" onclick="doLogin()">Log in</button></div>
       <div style="text-align:center;margin-top:10px"><span style="cursor:pointer;color:#0f766e;font-size:13px" onclick="toggleSignup()">New adopter? Create an account</span></div>
       <div class="note" style="margin-top:16px">Demo accounts — password for all is <b>BISM7255</b>. Click one to fill:
         <div style="margin-top:6px">${S.users.map(u=>`<div style="cursor:pointer;padding:3px 0;color:#0f766e" onclick="quickFill('${u.email}')">• ${u.name} — ${u.role}${u.status==='Inactive'?' (Inactive)':''}</div>`).join('')}</div>
       </div>`}
   </div></div>`;
}
function render(){
  if(!S.authed){$('app').innerHTML=loginView();return}
  const views={home,listing,profiles,animalDetail,intake,apply:applyView,myprofile:adopterProfileView,applications:applicationsView,users:usersView,userDetail,system:systemView};
  // guard
  if(S.view==='profile')S.view='profile';
  const map={profile:profiles};
  let body;
  if(S.view==='animalDetail')body=animalDetail();
  else if(S.view==='profile')body=profiles();
  else body=(views[S.view]||home)();
  $('app').innerHTML=`
   <header><span class="logo">🐾 ShelterLink</span>
     <div class="badge">${role()}</div>
     <span class="spacer"></span>
     <button class="btn sec" style="padding:5px 9px;font-size:12px" onclick="exportExcel()" title="Download all data as Excel">⬇ Excel</button>
     <label class="btn sec" style="padding:5px 9px;font-size:12px;cursor:pointer" title="Load data from an Excel file">⬆ Import<input type="file" accept=".xlsx" style="display:none" onchange="importExcelFile(this.files[0])"></label>
     <button class="btn sec" style="padding:5px 9px;font-size:12px" onclick="syncFile()" title="Connect an Excel file so edits auto-save">${S.synced?'✓ Synced':'🔗 Sync'}</button>
     <span style="font-size:13px">👤 ${me().name}</span>
     <button class="btn sec" style="padding:5px 12px" onclick="logout()">Log out</button>
   </header>
   <div class="wrap">${nav()}<main>${body}</main></div>`;
  autosave();
}
render();
</script>
